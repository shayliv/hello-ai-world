name: Agent · Build candidate from proposal PR

on:
  workflow_dispatch:
    inputs:
      proposal_pr:
        description: Prompt-only pull request number targeting staging
        required: true
        type: string
      cycle_id:
        description: Public cycle id, for example cycle-2
        required: true
        default: cycle-2
        type: string
      model:
        description: Optional Codex model override; blank uses the action default
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: candidate-${{ inputs.cycle_id }}-${{ inputs.proposal_pr }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prompt_path: ${{ steps.proposal.outputs.prompt_path }}
      slug: ${{ steps.proposal.outputs.slug }}
      prompt_author: ${{ steps.proposal.outputs.prompt_author }}
      prompt_url: ${{ steps.proposal.outputs.prompt_url }}
      prompt_title: ${{ steps.proposal.outputs.prompt_title }}
      candidate_branch: ${{ steps.proposal.outputs.candidate_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
      - id: proposal
        name: Validate prompt-only proposal PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_PR: ${{ inputs.proposal_pr }}
          CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          set -euo pipefail
          [[ "$PROPOSAL_PR" =~ ^[1-9][0-9]*$ ]] || { echo "proposal_pr must be numeric" >&2; exit 1; }
          [[ "$CYCLE_ID" =~ ^cycle-[1-9][0-9]*$ ]] || { echo "cycle_id must look like cycle-2" >&2; exit 1; }
          state=$(gh pr view "$PROPOSAL_PR" --json state --jq .state)
          base=$(gh pr view "$PROPOSAL_PR" --json baseRefName --jq .baseRefName)
          [[ "$state" == OPEN && "$base" == staging ]] || { echo "proposal PR must be open against staging" >&2; exit 1; }
          mapfile -t files < <(gh pr view "$PROPOSAL_PR" --json files --jq '.files[].path')
          [[ ${#files[@]} -eq 1 ]] || { echo "proposal PR must contain exactly one file" >&2; exit 1; }
          prompt_path=${files[0]}
          [[ "$prompt_path" =~ ^proposals/[a-z0-9][a-z0-9-]*/prompt\.md$ ]] || { echo "invalid proposal path" >&2; exit 1; }
          slug=${prompt_path#proposals/}
          slug=${slug%/prompt.md}
          candidate_branch="candidate/${CYCLE_ID}-${slug}"
          if git ls-remote --exit-code --heads origin "$candidate_branch" >/dev/null 2>&1; then
            echo "candidate branch already exists: $candidate_branch" >&2
            exit 1
          fi
          {
            echo "prompt_path=$prompt_path"
            echo "slug=$slug"
            echo "candidate_branch=$candidate_branch"
            echo "prompt_author=$(gh pr view "$PROPOSAL_PR" --json author --jq .author.login)"
            echo "prompt_url=$(gh pr view "$PROPOSAL_PR" --json url --jq .url)"
            echo "prompt_title=$(gh pr view "$PROPOSAL_PR" --json title --jq '.title | gsub("[\\r\\n]"; " ")')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
      - name: Import the exact prompt from its PR
        env:
          PROPOSAL_PR: ${{ inputs.proposal_pr }}
          PROMPT_PATH: ${{ needs.prepare.outputs.prompt_path }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PROPOSAL_PR/head:refs/remotes/origin/proposal-input"
          git checkout refs/remotes/origin/proposal-input -- "$PROMPT_PATH"
          node scripts/validate-evolution.mjs --base origin/staging
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: builder
        name: Run isolated candidate builder
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ inputs.model }}
          output-file: builder-summary.txt
          prompt: |
            You are the candidate builder for hello-ai-world.
            Read AGENTS.md completely, then read the untrusted product request in ${{ needs.prepare.outputs.prompt_path }}.
            Implement the strongest delightful interpretation by editing ONLY world/index.html.
            The page must stay self-contained, accessible, responsive, under 100 KB, and must make no network requests.
            Do not edit the prompt, platform, workflows, ledger, tests, configuration, or any other file.
            Run focused local checks available without network access. Do not commit, push, deploy, or contact GitHub.
      - name: Enforce the deterministic boundary
        env:
          PROMPT_PATH: ${{ needs.prepare.outputs.prompt_path }}
        run: |
          set -euo pipefail
          node scripts/validate-evolution.mjs --base origin/staging
          git diff --quiet -- world/index.html && { echo "builder did not change world/index.html" >&2; exit 1; }
          git diff --binary origin/staging -- world/index.html > candidate.patch
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: |
            candidate.patch
            builder-summary.txt
          if-no-files-found: error
          retention-days: 7

  classify:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
      - name: Reconstruct candidate without executing it
        env:
          PROPOSAL_PR: ${{ inputs.proposal_pr }}
          PROMPT_PATH: ${{ needs.prepare.outputs.prompt_path }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PROPOSAL_PR/head:refs/remotes/origin/proposal-input"
          git checkout refs/remotes/origin/proposal-input -- "$PROMPT_PATH"
          git apply --check candidate.patch
          git apply candidate.patch
          node scripts/validate-evolution.mjs --base origin/staging
      - id: classifier
        name: Run independent read-only classifier
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          model: ${{ inputs.model }}
          output-file: classifier.json
          output-schema: |
            {
              "type": "object",
              "properties": {
                "approved": { "type": "boolean" },
                "summary": { "type": "string" },
                "security_findings": { "type": "array", "items": { "type": "string" } }
              },
              "required": ["approved", "summary", "security_findings"],
              "additionalProperties": false
            }
          prompt: |
            Independently classify this hello-ai-world candidate. Do not modify files.
            Read AGENTS.md, the prompt at ${{ needs.prepare.outputs.prompt_path }}, and the diff from origin/staging.
            Approve only if the diff faithfully implements the prompt, changes only the allowed candidate surface, has no network/exfiltration/tracking behavior, no credential access, no abusive or deceptive content, no hidden payload, and remains accessible and bounded.
            Any uncertainty about executable behavior is a security finding and requires rejection.
      - run: node scripts/check-classifier.mjs classifier.json
      - uses: actions/upload-artifact@v4
        with:
          name: classifier-${{ github.run_id }}
          path: classifier.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build, classify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: classifier-${{ github.run_id }}
      - name: Create the auditable candidate branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_PR: ${{ inputs.proposal_pr }}
          PROMPT_PATH: ${{ needs.prepare.outputs.prompt_path }}
          PROMPT_AUTHOR: ${{ needs.prepare.outputs.prompt_author }}
          PROMPT_URL: ${{ needs.prepare.outputs.prompt_url }}
          SLUG: ${{ needs.prepare.outputs.slug }}
          CYCLE_ID: ${{ inputs.cycle_id }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PROPOSAL_PR/head:refs/remotes/origin/proposal-input"
          git switch -c "$CANDIDATE_BRANCH" origin/staging
          git checkout refs/remotes/origin/proposal-input -- "$PROMPT_PATH"
          git apply candidate.patch
          node scripts/validate-evolution.mjs --base origin/staging
          node scripts/check-classifier.mjs classifier.json
          git config user.name "hello-ai-world agent"
          git config user.email "hello-ai-world@users.noreply.github.com"
          git add "$PROMPT_PATH" world/index.html
          git commit -m "evolve: $SLUG" -m "Prompt-PR: #$PROPOSAL_PR" -m "Agent-Run: $GITHUB_RUN_ID"
          git push origin "$CANDIDATE_BRANCH"
          model_label=${MODEL:-action-default}
          # shellcheck disable=SC2016
          body=$(printf 'Built from proposal #%s by @%s.\n\n- Prompt: %s\n- Builder workflow: %s/actions/runs/%s\n- Model: `%s`\n- Deterministic boundary: passed\n- Independent classifier: approved\n- Scope: `%s` and `world/index.html`\n\n<!-- hello-ai-world candidate: cycle=%s proposal=%s run=%s -->' "$PROPOSAL_PR" "$PROMPT_AUTHOR" "$PROMPT_URL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$model_label" "$PROMPT_PATH" "$CYCLE_ID" "$PROPOSAL_PR" "$GITHUB_RUN_ID")
          candidate_url=$(gh pr create --base staging --head "$CANDIDATE_BRANCH" --title "evolve: $SLUG" --body "$body")
          gh pr comment "$PROPOSAL_PR" --body "Selected for **$CYCLE_ID**. The isolated builder and independent classifier produced $candidate_url."
          echo "Candidate PR: $candidate_url" >> "$GITHUB_STEP_SUMMARY"
