name: Deploy · Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type STAGING to deploy the staging branch
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'STAGING'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ledger:check
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: hello-ai-world-staging
          source: .
          env_vars: |-
            APP_MODE=platform
            NODE_ENV=production
            DATABASE_BACKEND=repository
          env_vars_update_strategy: overwrite
          secrets: "{}"
          secrets_update_strategy: overwrite
          labels: |-
            hello-ai-world-kind=staging
          flags: >-
            --service-account=${{ vars.GCP_CONTROL_SERVICE_ACCOUNT }}
            --no-invoker-iam-check
            --min-instances=0
            --max-instances=2
            --memory=512Mi
            --cpu=1
      - name: Smoke repository-backed staging
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$URL/healthz"
          curl --fail --silent --show-error "$URL/api/state" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);if(v.source!=="repository")process.exit(1)})'
          echo "Staging: $URL" >> "$GITHUB_STEP_SUMMARY"
