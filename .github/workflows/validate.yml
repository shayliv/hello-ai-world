name: validate

on:
  push:
    branches: [production, staging]
  pull_request:
    branches: [production, staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Enforce prompt and candidate boundaries
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'proposal/') || startsWith(github.head_ref, 'candidate/'))
        run: node scripts/validate-evolution.mjs --base "${{ github.event.pull_request.base.sha }}"
