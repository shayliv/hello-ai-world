<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f2efe8">
    <title>hello, ai world</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2efe8;
        color: #20201e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.9) 0, rgba(255, 255, 255, 0.32) 28%, transparent 58%),
          #f2efe8;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: clamp(1.5rem, 5vw, 4rem);
        cursor: crosshair;
      }

      main::before {
        position: absolute;
        inset: clamp(0.75rem, 2vw, 1.5rem);
        z-index: -1;
        border: 1px solid rgba(32, 32, 30, 0.08);
        border-radius: clamp(1.25rem, 3vw, 2rem);
        content: "";
        pointer-events: none;
      }

      .greeting {
        position: relative;
        z-index: 2;
        margin: 0;
        border: 0;
        border-radius: 0.2em;
        padding: 0.18em 0.28em 0.24em;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: clamp(2.3rem, 8vw, 7.5rem);
        font-weight: 430;
        letter-spacing: -0.065em;
        line-height: 0.94;
        cursor: pointer;
        text-wrap: balance;
      }

      .greeting::after {
        position: absolute;
        right: 0.3em;
        bottom: 0.02em;
        left: 0.3em;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.22;
        transform: scaleX(0.14);
        transition: opacity 180ms ease, transform 280ms ease;
      }

      .greeting:hover::after,
      .greeting:focus-visible::after {
        opacity: 0.5;
        transform: scaleX(1);
      }

      .greeting:focus-visible {
        outline: 2px solid #20201e;
        outline-offset: 0.18em;
      }

      .hint {
        position: fixed;
        right: 0;
        bottom: max(1.4rem, env(safe-area-inset-bottom));
        left: 0;
        z-index: 2;
        margin: 0;
        color: rgba(32, 32, 30, 0.52);
        font-size: clamp(0.7rem, 1.4vw, 0.8rem);
        font-weight: 520;
        letter-spacing: 0.12em;
        line-height: 1.4;
        text-align: center;
        text-transform: uppercase;
        pointer-events: none;
      }

      .echo {
        --echo-rotation: 0deg;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
        width: max-content;
        max-width: 92vw;
        color: #3f5f70;
        font-size: clamp(1rem, 2.6vw, 2.25rem);
        font-weight: 520;
        letter-spacing: -0.035em;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) rotate(var(--echo-rotation)) scale(0.72);
        transform-origin: center;
        animation: echo-out 1.45s cubic-bezier(0.16, 0.72, 0.25, 1) forwards;
        user-select: none;
        white-space: nowrap;
        will-change: opacity, transform;
      }

      @keyframes echo-out {
        0% {
          opacity: 0.3;
          transform: translate(-50%, -50%) rotate(var(--echo-rotation)) scale(0.72);
        }
        34% {
          opacity: 0.19;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(var(--echo-rotation)) scale(2.35);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .greeting::after {
          transition: none;
        }

        .echo {
          animation: none;
          opacity: 0.18;
          transform: translate(-50%, -50%);
        }
      }

      @media (max-width: 34rem) {
        .greeting {
          letter-spacing: -0.055em;
        }

        .hint {
          padding-inline: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="echo-field">
      <button class="greeting" type="button" aria-describedby="instructions">hello, ai world</button>
      <p class="hint" id="instructions">tap anywhere · or press enter</p>
    </main>

    <script>
      (() => {
        "use strict";

        const field = document.querySelector("#echo-field");
        const greeting = document.querySelector(".greeting");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const echoLimit = 10;
        let echoCount = 0;

        const createEcho = (x, y) => {
          const echoes = field.querySelectorAll(".echo");
          if (echoes.length >= echoLimit) {
            echoes[0].remove();
          }

          const echo = document.createElement("span");
          const rotation = ((echoCount % 5) - 2) * 0.7;
          echo.className = "echo";
          echo.setAttribute("aria-hidden", "true");
          echo.textContent = "hello, ai world";
          echo.style.left = `${x}px`;
          echo.style.top = `${y}px`;
          echo.style.setProperty("--echo-rotation", `${rotation}deg`);
          echoCount += 1;
          field.append(echo);

          if (reducedMotion.matches) {
            window.setTimeout(() => echo.remove(), 650);
          } else {
            echo.addEventListener("animationend", () => echo.remove(), { once: true });
          }
        };

        field.addEventListener("click", (event) => {
          if (event.detail === 0) {
            const bounds = greeting.getBoundingClientRect();
            createEcho(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2);
            return;
          }

          createEcho(event.clientX, event.clientY);
        });
      })();
    </script>
  </body>
</html>
