<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hello, ai world</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #f5f4ef;
        color: #111;
        font: 32px/1.2 Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <main id="message">hello, ai world</main>
    <script>
      fetch("/api/state")
        .then((response) => response.json())
        .then((state) => { document.querySelector("#message").textContent = state.message; })
        .catch(() => {});
    </script>
  </body>
</html>
